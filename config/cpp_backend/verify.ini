[service]
auto_start = true
run_for_ms = 0

[logging]
level = info
console = true
file = build/verify/cpp_backend/service.log

[storage]
result_jsonl = build/verify/cpp_backend/results.jsonl
async_result_writes = true
result_queue_capacity = 512
drop_results_when_full = false

[camera_driver]
backend = mock
output_dir = build/verify/cpp_backend/captures
frame_timeout_ms = 1500
default_trigger_source = Line0
default_trigger_activation = RisingEdge
enable_ptp = true
enable_chunk_timestamp = true
host_correlate_camera_time = true
apply_frame_settings = true
save_format = jpg
jpeg_quality = 90

[detector.primary]
backend = mock

[detector.patch]
backend = mock

[camera.1]
id = 1
name = A-camera
watch_dir = build/generated_demo/camera1

[camera.2]
id = 2
name = B-camera
watch_dir = build/generated_demo/camera2

[runtime]
input_mode = watch_dir
publish_no_bag_results = true
poll_interval_ms = 100
file_stable_ms = 300
file_ready_timeout_ms = 5000
cooldown_ms = 300
queue_capacity = 256
defect_worker_count = 4
expected_burst_images_per_camera = 3
bag_capture_timeout_ms = 1500
sort_result_timeout_ms = 1500

[detection]
presence_enabled = true
advance_on_presence = true
advance_trigger_camera_id = 0
patch_enabled = true
patch_horizontal = 4
patch_vertical = 5
primary_conf_threshold = 0.30
patch_conf_threshold = 0.20

[correlation]
enabled = true
expected_camera_ids = 1,2
hold_non_defect_until_complete = true
pending_timeout_ms = 1500
timeout_action = reject
finalized_retention_ms = 5000

[plc]
backend = mock
enabled = true
ack_timeout_ms = 200
presence_message_timeout_ms = 200
max_retries = 1
retry_interval_ms = 50
mock_fail_first_attempts = 0
mock_ack_latency_ms = 0
mock_presence_latency_ms = 0
