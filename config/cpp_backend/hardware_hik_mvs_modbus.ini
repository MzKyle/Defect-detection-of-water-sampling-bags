[service]
auto_start = true
run_for_ms = 0

[logging]
level = info
console = true
file = artifacts/cpp_backend/hardware_service.log

[storage]
result_jsonl = artifacts/cpp_backend/hardware_results.jsonl
async_result_writes = true
result_queue_capacity = 512
drop_results_when_full = false

[camera_driver]
backend = hikvision_mvs
output_dir = artifacts/cpp_backend/captures
frame_timeout_ms = 1500
default_trigger_source = Line0
default_trigger_activation = RisingEdge
enable_ptp = true
enable_chunk_timestamp = true
host_correlate_camera_time = true
apply_frame_settings = true
save_format = jpg
jpeg_quality = 90

[detector.primary]
backend = mock
# backend = onnxruntime_cuda
# model_path = artifacts/models/primary.onnx
# use_cuda = true
# cuda_device_id = 0
# imgsz = 640
# nms_iou_threshold = 0.45

[detector.patch]
backend = mock
# backend = onnxruntime_cuda
# model_path = artifacts/models/patch.onnx
# use_cuda = true
# cuda_device_id = 0
# imgsz = 640
# nms_iou_threshold = 0.45

[camera.1]
id = 1
name = A-camera
watch_dir = artifacts/cpp_backend/hardware_events/camera1
# serial_number =
# device_user_id =
# device_index = 0
trigger_source = Line0

[camera.2]
id = 2
name = B-camera
watch_dir = artifacts/cpp_backend/hardware_events/camera2
# serial_number =
# device_user_id =
# device_index = 1
trigger_source = Line0

[runtime]
input_mode = plc_presence
publish_no_bag_results = false
poll_interval_ms = 50
file_stable_ms = 300
file_ready_timeout_ms = 5000
cooldown_ms = 150
queue_capacity = 256
defect_worker_count = 4
expected_burst_images_per_camera = 3
bag_capture_timeout_ms = 1500
sort_result_timeout_ms = 1500
heartbeat_interval_ms = 500
heartbeat_failure_threshold = 3
presence_checkpoint = artifacts/cpp_backend/presence_checkpoint.txt

[detection]
presence_enabled = true
advance_on_presence = true
advance_trigger_camera_id = 0
patch_enabled = true
patch_horizontal = 4
patch_vertical = 5
primary_conf_threshold = 0.30
patch_conf_threshold = 0.20

[correlation]
enabled = true
expected_camera_ids = 1,2
hold_non_defect_until_complete = true
pending_timeout_ms = 1500
timeout_action = reject
finalized_retention_ms = 5000

[plc]
backend = modbus_tcp
enabled = true
ack_timeout_ms = 200
presence_message_timeout_ms = 200
max_retries = 1
retry_interval_ms = 50
presence_checkpoint = artifacts/cpp_backend/presence_checkpoint.txt

[plc.modbus_tcp]
host = 192.168.1.50
port = 502
unit_id = 1
connect_timeout_ms = 500
read_timeout_ms = 200
write_timeout_ms = 200
ack_timeout_ms = 200
ack_poll_interval_ms = 20

# Reference register map. All addresses are zero-based Modbus addresses.
discrete_input_bag_present = 0
input_register_message_id = 0
input_register_bag_id_high = 1
input_register_bag_id_low = 2
input_register_ack_status = 10
input_register_fault_code = 11

holding_register_command_id = 0
holding_register_bag_id_high = 1
holding_register_bag_id_low = 2
holding_register_action_code = 5
holding_register_burst_frame_count = 6
holding_register_burst_frame_base = 20
burst_frame_register_stride = 4

coil_start_burst = 0
coil_station_release = 1
coil_station_push = 2
coil_station_restore = 3
coil_sort_ok = 10
coil_sort_ng = 11
coil_heartbeat = 20
coil_line_stop = 21

ack_idle_value = 0
ack_success_value = 1
ack_failure_value = 2
clear_command_coil_after_ack = true
write_bag_id_registers = true
